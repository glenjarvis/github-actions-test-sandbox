name: Hello World

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      version:
        description: "Version to deploy"
        required: true
        type: string

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print a specific variable
        run: echo hello '${{github.event.commits[0].author.name}}'
      - name: Print all of the github variables
        run: echo start 'toJSON(${{github}})'
